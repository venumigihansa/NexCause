apiVersion: v1
kind: ConfigMap
metadata:
  name: rca-agent-service-config
  namespace: deployment-manager
data:
  PORT: "8080"
  RCA_MCP_SERVER_URL: "http://rca-mcp-server.deployment-manager.svc.cluster.local/mcp"
  RCA_AGENT_POLL_ENABLED: "true"
  RCA_AGENT_POLL_INTERVAL_SECONDS: "10"
  RCA_MAX_FOLLOWUP_ROUNDS: "2"
  RCA_MAX_VERIFIER_RETRIES: "1"
  RCA_LLM_PROVIDER: "gemini"
  RCA_LLM_MODEL: "gemini-1.5-flash"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-agent-service
  namespace: deployment-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rca-agent-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rca-agent-service
    spec:
      containers:
        - name: rca-agent-service
          image: rca-agent-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rca-agent-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deployment-manager-database
                  key: DATABASE_URL
            - name: RCA_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rca-agent-service-secrets
                  key: RCA_LLM_API_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rca-agent-service
  namespace: deployment-manager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rca-agent-service
  ports:
    - name: http
      port: 80
      targetPort: http
