global:
  database:
    bundled: true
    deploymentManagerSecretName: rca-platform-database
    migratorSecretName: rca-platform-database-migrator
    agentSecretName: rca-platform-database-agent
    mcpSecretName: rca-platform-database-mcp

gateway:
  enabled: true
  consoleHostname: console.rca.local
  deploymentManagerHostname: manager.rca.local
  applicationWildcardHostname: "*.apps.rca.local"
  tls:
    issuerRef:
      group: cert-manager.io
      kind: Issuer
      name: rca-local-selfsigned
    localIssuer:
      enabled: true
      name: rca-local-selfsigned

postgres:
  enabled: true
  auth:
    username: deployment_manager
    password: deployment_manager
    database: deployment_manager
    adminUsername: postgres
    adminPassword: postgres-local-development
    migratorPassword: migrator-local-development
    agentPassword: agent-local-development
    mcpPassword: mcp-local-development
    sslMode: disable
  persistence:
    enabled: true
    size: 2Gi
    storageClass: standard

registry:
  enabled: true
  service:
    type: NodePort
    port: 5000
    nodePort: 30500
  persistence:
    enabled: true
    size: 5Gi
    storageClass: standard

deployment-manager:
  tenantNetworkPolicy:
    enabled: true
  applicationRouting:
    enabled: true
    gatewayName: rca-gateway
    applicationWildcardHostname: "*.apps.rca.local"
    namespaceLabel:
      key: rca-platform.io/gateway-access
      value: "true"
  localRegistry:
    enabled: true
    port: 5000
  service:
    type: ClusterIP
    nodePort: null
  config:
    ASGARDEO_ISSUER: https://api.eu.asgardeo.io/t/causiumdev2026/oauth2/token
    ASGARDEO_CLIENT_ID: MUgzzhvC63u7kcgrElZZTwrmRPca
    ASGARDEO_API_AUDIENCE: https://manager.rca.local
    ASGARDEO_ROOT_ORGANIZATION_ID: 29e0781f-ecb1-4d62-b5f6-4c60170ae7e0
    AUTH_CALLBACK_URL: https://console.rca.local/auth/callback
    APP_UI_URL: https://console.rca.local
    AUTH_POST_LOGOUT_URL: https://console.rca.local
    AUTH_COOKIE_SECURE: "true"
    APP_UI_ORIGINS: https://console.rca.local
    DEFAULT_KUBERNETES_NAMESPACE: apps
    LOCAL_REGISTRY_HOST: localhost:30500
    BUILDPACK_BUILDER_IMAGE: gcr.io/buildpacks/builder
    BUILDPACK_RUNNER_IMAGE: ghcr.io/venumigihansa/nexcause-buildpack-runner:0.1.3

frontend:
  config:
    environment: kind
    OBSERVABILITY_ENABLED: "false"
    INCIDENT_DETECTION_ENABLED: "false"
    AUTO_RCA_ENABLED: "false"
    RCA_AGENT_ENABLED: "true"
    RCA_AGENT_TRIGGER_MODE: async

rca-agent:
  config:
    RCA_AGENT_POLL_ENABLED: "false"

prometheus:
  server:
    retention: 1h
    persistentVolume: { enabled: true, size: 2Gi, storageClass: standard }

loki:
  singleBinary:
    persistence: { enabled: true, size: 2Gi, storageClass: standard }

tempo:
  tempo: { retention: 1h }
  persistence: { enabled: true, size: 2Gi, storageClassName: standard }
