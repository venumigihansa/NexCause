global:
  database:
    secretName: ""
    secretKey: DATABASE_URL
    deploymentManagerSecretName: ""
    migratorSecretName: ""
    agentSecretName: ""
    mcpSecretName: ""
    bundled: false
  internalAuth:
    secretName: rca-internal-auth
    secretKey: INTERNAL_SERVICE_JWT_SECRET
  externalSecrets:
    enabled: false
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: aws-secrets-manager
    mappings: []
  imagePullSecrets: []
  observability:
    enabled: true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

gateway:
  enabled: false
  name: rca-gateway
  className: kgateway
  deploymentManagerHostname: ""
  applicationWildcardHostname: ""
  allowedRoutes:
    namespaceLabel:
      key: rca-platform.io/gateway-access
      value: "true"
  tls:
    secretName: rca-gateway-tls
    issuerRef:
      group: cert-manager.io
      kind: Issuer
      name: rca-local-selfsigned
    localIssuer:
      enabled: false
      name: rca-local-selfsigned
  aws:
    enabled: false
    gatewayParametersName: rca-aws-gateway
    proxyReplicas: 2
    serviceAnnotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance

deployment-manager:
  image:
    repository: ghcr.io/venumigihansa/nexcause-deployment-manager
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  migration:
    enabled: true
  auth:
    existingSecret:
      name: rca-asgardeo
      clientSecretKey: ASGARDEO_CLIENT_SECRET
      encryptionKeyKey: AUTH_SESSION_ENCRYPTION_KEY
  config:
    DEFAULT_KUBERNETES_NAMESPACE: apps
    OBSERVABILITY_ENABLED: "true"
    INCIDENT_DETECTION_ENABLED: "false"
    AUTO_RCA_ENABLED: "false"
    RCA_AGENT_ENABLED: "true"
    RCA_AGENT_TRIGGER_MODE: async
    BUILDPACK_RUNNER_IMAGE: ghcr.io/venumigihansa/nexcause-buildpack-runner:0.1.0
    ASGARDEO_ISSUER: ""
    ASGARDEO_CLIENT_ID: ""
    ASGARDEO_API_AUDIENCE: ""
    ASGARDEO_ROOT_ORGANIZATION_ID: ""
    ASGARDEO_SCOPES: "openid profile email apps:read apps:create deployments:read deployments:write deployments:delete builds:read builds:start logs:read incidents:read incidents:manage rca:read rca:run rca:chat:read rca:chat:write members:manage secrets:write"
    AUTH_CALLBACK_URL: http://localhost:3000/auth/callback
    APP_UI_URL: http://localhost:3000/auth/me
    AUTH_POST_LOGOUT_URL: http://localhost:3000/auth/me
    AUTH_COOKIE_SECURE: "false"
    APP_UI_ORIGINS: http://localhost:3000

rca-agent:
  image:
    repository: ghcr.io/venumigihansa/nexcause-rca-agent
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  existingSecret:
    name: ""
    llmApiKeyKey: RCA_LLM_API_KEY
  config:
    RCA_AGENT_POLL_ENABLED: "true"
    RCA_AGENT_POLL_INTERVAL_SECONDS: "10"
    RCA_LLM_PROVIDER: gemini
    RCA_LLM_MODEL: gemini-1.5-flash
    RCA_LLM_TIMEOUT_SECONDS: "30"

mcp-server:
  image:
    repository: ghcr.io/venumigihansa/nexcause-mcp-server
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  config:
    KUBERNETES_IN_CLUSTER: "true"
    DEFAULT_LOOKBACK_MINUTES: "10"
    DEFAULT_LOOKAHEAD_MINUTES: "2"
    MAX_RECURSION_DEPTH: "3"
    MAX_LOG_LINES: "500"
    MAX_SAMPLES: "120"
    MAX_SPANS: "100"

observability:
  enabled: true

prometheus:
  alertmanager: { enabled: false }
  prometheus-pushgateway: { enabled: false }
  prometheus-node-exporter: { enabled: false }
  server:
    fullnameOverride: rca-observability-prometheus
    retention: 24h
    persistentVolume:
      enabled: true
      size: 8Gi
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }
  extraScrapeConfigs: |
    - job_name: otel-collector
      scrape_interval: 15s
      static_configs:
        - targets: [rca-observability-otel:8889]

loki:
  fullnameOverride: rca-observability-loki
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig: { replication_factor: 1 }
    storage: { type: filesystem }
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: { prefix: loki_index_, period: 24h }
  singleBinary:
    replicas: 1
    persistence: { enabled: true, size: 8Gi }
  read: { replicas: 0 }
  write: { replicas: 0 }
  backend: { replicas: 0 }
  gateway: { enabled: false }
  chunksCache: { enabled: false }
  resultsCache: { enabled: false }
  test: { enabled: false }
  lokiCanary: { enabled: false }

tempo:
  fullnameOverride: rca-observability-tempo
  tempo:
    retention: 24h
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 768Mi }
  persistence: { enabled: true, size: 8Gi }

opentelemetry-collector:
  fullnameOverride: rca-observability-otel
  mode: deployment
  presets:
    kubernetesAttributes: { enabled: true }
  image: { repository: otel/opentelemetry-collector-contrib }
  service: { type: ClusterIP }
  ports:
    otlp: { enabled: true, containerPort: 4317, servicePort: 4317, protocol: TCP }
    otlp-http: { enabled: true, containerPort: 4318, servicePort: 4318, protocol: TCP }
    prometheus: { enabled: true, containerPort: 8889, servicePort: 8889, protocol: TCP }
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  config:
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: '${env:MY_POD_IP}:4317' }
          http: { endpoint: '${env:MY_POD_IP}:4318' }
    processors:
      memory_limiter: { check_interval: 1s, limit_percentage: 75, spike_limit_percentage: 20 }
      batch: {}
      k8sattributes: {}
    exporters:
      otlp/tempo: { endpoint: rca-observability-tempo:4317, tls: { insecure: true } }
      prometheus: { endpoint: '${env:MY_POD_IP}:8889' }
      otlphttp/loki: { endpoint: http://rca-observability-loki:3100/otlp }
    service:
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, k8sattributes, batch], exporters: [otlp/tempo] }
        metrics: { receivers: [otlp], processors: [memory_limiter, k8sattributes, batch], exporters: [prometheus] }
        logs: { receivers: [otlp], processors: [memory_limiter, k8sattributes, batch], exporters: [otlphttp/loki] }

grafana:
  fullnameOverride: rca-observability-grafana
  deploymentStrategy:
    type: Recreate
  adminUser: admin
  adminPassword: ""
  persistence: { enabled: true, size: 5Gi }
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - { name: Prometheus, uid: prometheus, type: prometheus, url: http://rca-observability-prometheus, access: proxy, isDefault: true, editable: false }
        - { name: Loki, uid: loki, type: loki, url: http://rca-observability-loki:3100, access: proxy, editable: false }
        - { name: Tempo, uid: tempo, type: tempo, url: http://rca-observability-tempo:3200, access: proxy, editable: false }
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: rca-platform
          orgId: 1
          folder: RCA Platform
          type: file
          disableDeletion: true
          editable: false
          options: { path: /var/lib/grafana/dashboards/rca-platform }
  dashboards:
    rca-platform:
      overview:
        json: |
          {
            "annotations":{"list":[]},
            "editable":false,
            "panels":[
              {"type":"timeseries","title":"Container CPU","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rate(container_cpu_usage_seconds_total{namespace=~\"apps|rca-platform\"}[5m])) by (namespace)","legendFormat":"{{namespace}}"}],"gridPos":{"h":8,"w":12,"x":0,"y":0}},
              {"type":"timeseries","title":"Pod Restarts","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(kube_pod_container_status_restarts_total) by (namespace)","legendFormat":"{{namespace}}"}],"gridPos":{"h":8,"w":12,"x":12,"y":0}},
              {"type":"logs","title":"Managed Application Logs","datasource":{"type":"loki","uid":"loki"},"targets":[{"expr":"{service_namespace=~\"apps|rca-platform\"}"}],"gridPos":{"h":10,"w":24,"x":0,"y":8}}
            ],
            "schemaVersion":41,
            "tags":["rca-platform"],
            "templating":{"list":[]},
            "time":{"from":"now-1h","to":"now"},
            "title":"RCA Platform Overview",
            "uid":"rca-platform-overview",
            "version":1
          }

postgres:
  enabled: false
  auth:
    username: deployment_manager
    password: ""
    database: deployment_manager
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""

registry:
  enabled: false
  service:
    type: ClusterIP
    port: 5000
    nodePort: null
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
