apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rca-agent.fullname" . }}
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
data:
  PORT: "8080"
  RCA_MCP_SERVER_URL: {{ printf "http://%s-mcp-server/mcp" .Release.Name | quote }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
