apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgres.fullname" . }}-init-roles
data:
  10-rca-roles.sh: |
    #!/bin/sh
    set -eu
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      --set=dm_password="$RCA_DEPLOYMENT_MANAGER_PASSWORD" \
      --set=migrator_password="$RCA_MIGRATOR_PASSWORD" \
      --set=agent_password="$RCA_AGENT_PASSWORD" \
      --set=mcp_password="$RCA_MCP_PASSWORD" <<'SQL'
{{ .Files.Get "files/rca-roles.sql" | indent 4 }}
    SQL
