{{- $dmPassword := required "postgres.auth.password is required when bundled Postgres is enabled" .Values.auth.password -}}
{{- $adminPassword := required "postgres.auth.adminPassword is required when bundled Postgres is enabled" .Values.auth.adminPassword -}}
{{- $migratorPassword := required "postgres.auth.migratorPassword is required when bundled Postgres is enabled" .Values.auth.migratorPassword -}}
{{- $agentPassword := required "postgres.auth.agentPassword is required when bundled Postgres is enabled" .Values.auth.agentPassword -}}
{{- $mcpPassword := required "postgres.auth.mcpPassword is required when bundled Postgres is enabled" .Values.auth.mcpPassword -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.fullname" . }}-admin
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.auth.adminUsername | quote }}
  POSTGRES_PASSWORD: {{ $adminPassword | quote }}
  POSTGRES_DB: {{ .Values.auth.database | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.fullname" . }}-roles
type: Opaque
stringData:
  RCA_DEPLOYMENT_MANAGER_PASSWORD: {{ $dmPassword | quote }}
  RCA_MIGRATOR_PASSWORD: {{ $migratorPassword | quote }}
  RCA_AGENT_PASSWORD: {{ $agentPassword | quote }}
  RCA_MCP_PASSWORD: {{ $mcpPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (include "rca-platform.databaseSecretName" .) .Values.global.database.deploymentManagerSecretName }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql://deployment_manager:%s@%s:%v/%s?schema=public&sslmode=%s&connection_limit=10&pool_timeout=5&connect_timeout=5" $dmPassword (include "postgres.fullname" .) .Values.service.port .Values.auth.database .Values.auth.sslMode | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-database-migrator" .Release.Name) .Values.global.database.migratorSecretName }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql://rca_migrator:%s@%s:%v/%s?schema=public&sslmode=%s&connection_limit=2&pool_timeout=5&connect_timeout=5" $migratorPassword (include "postgres.fullname" .) .Values.service.port .Values.auth.database .Values.auth.sslMode | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-database-agent" .Release.Name) .Values.global.database.agentSecretName }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql://rca_agent:%s@%s:%v/%s?sslmode=%s&connect_timeout=5" $agentPassword (include "postgres.fullname" .) .Values.service.port .Values.auth.database .Values.auth.sslMode | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-database-mcp" .Release.Name) .Values.global.database.mcpSecretName }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql://rca_mcp:%s@%s:%v/%s?sslmode=%s&connect_timeout=5" $mcpPassword (include "postgres.fullname" .) .Values.service.port .Values.auth.database .Values.auth.sslMode | quote }}
