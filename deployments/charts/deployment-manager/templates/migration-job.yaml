{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "deployment-manager.fullname" . }}-migration{{- if and .Values.global.database.bundled .Release.IsInstall }}-install{{- end }}
  labels:
    {{- include "deployment-manager.labels" . | nindent 4 }}
  annotations:
    {{- if not (and .Values.global.database.bundled .Release.IsInstall) }}
    helm.sh/hook: "pre-install,pre-upgrade"
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- end }}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  {{- if and .Values.global.database.bundled .Release.IsInstall }}
  ttlSecondsAfterFinished: 300
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "deployment-manager.name" . }}-migration
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npm", "run", "prisma:migrate:deploy"]
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.global.containerSecurityContext) .Values.containerSecurityContext) | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "rca-platform.databaseSecretName" .) .Values.global.database.migratorSecretName }}
                  key: {{ .Values.global.database.secretKey }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
