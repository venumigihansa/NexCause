apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "deployment-manager.fullname" . }}
  labels:
    {{- include "deployment-manager.labels" . | nindent 4 }}
data:
  PORT: "3000"
  RCA_MCP_SERVER_URL: {{ printf "http://%s-mcp-server/mcp" .Release.Name | quote }}
  RCA_AGENT_SERVICE_URL: {{ printf "http://%s-rca-agent" .Release.Name | quote }}
  {{- if .Values.global.observability.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://rca-observability-otel:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  {{- end }}
  {{- if .Values.localRegistry.enabled }}
  LOCAL_REGISTRY_CLUSTER: {{ printf "%s-registry:%v" .Release.Name .Values.localRegistry.port | quote }}
  {{- end }}
  APPLICATION_ROUTING_ENABLED: {{ .Values.applicationRouting.enabled | quote }}
  TENANT_NETWORK_POLICY_ENABLED: {{ .Values.tenantNetworkPolicy.enabled | quote }}
  APPLICATION_GATEWAY_NAME: {{ .Values.applicationRouting.gatewayName | quote }}
  APPLICATION_GATEWAY_NAMESPACE: {{ .Release.Namespace | quote }}
  {{- if .Values.applicationRouting.enabled }}
  APPLICATION_WILDCARD_HOSTNAME: {{ required "applicationRouting.applicationWildcardHostname is required when application routing is enabled" .Values.applicationRouting.applicationWildcardHostname | quote }}
  GATEWAY_ACCESS_NAMESPACE_LABEL_KEY: {{ required "applicationRouting.namespaceLabel.key is required when application routing is enabled" .Values.applicationRouting.namespaceLabel.key | quote }}
  GATEWAY_ACCESS_NAMESPACE_LABEL_VALUE: {{ required "applicationRouting.namespaceLabel.value is required when application routing is enabled" .Values.applicationRouting.namespaceLabel.value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
