replicaCount: 1
image:
  repository: rca-platform/deployment-manager
  tag: dev
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  nodePort: null
migration:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 300
auth:
  existingSecret:
    name: rca-asgardeo
    clientSecretKey: ASGARDEO_CLIENT_SECRET
    encryptionKeyKey: AUTH_SESSION_ENCRYPTION_KEY
sessionCleanup:
  enabled: true
  schedule: "*/15 * * * *"
localRegistry:
  enabled: false
  port: 5000
config: {}
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 500m, memory: 512Mi }
podAnnotations: {}
containerSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
nodeSelector: {}
tolerations: []
affinity: {}
