replicaCount: 1
image:
  repository: ghcr.io/venumigihansa/nexcause-deployment-manager
  tag: "0.1.3"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  nodePort: null
migration:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 300
auth:
  existingSecret:
    name: rca-asgardeo
    clientSecretKey: ASGARDEO_CLIENT_SECRET
    encryptionKeyKey: AUTH_SESSION_ENCRYPTION_KEY
sessionCleanup:
  enabled: true
  schedule: "*/15 * * * *"
localRegistry:
  enabled: false
  port: 5000
applicationRouting:
  enabled: false
  gatewayName: rca-gateway
  applicationWildcardHostname: ""
  namespaceLabel:
    key: rca-platform.io/gateway-access
    value: "true"
tenantNetworkPolicy:
  enabled: false
telemetry:
  queryTimeoutSeconds: 15
  maxLookbackMinutes: 360
  maxLogLines: 500
  maxTraces: 200
config: {}
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 500m, memory: 512Mi }
podAnnotations: {}
containerSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
nodeSelector: {}
tolerations: []
affinity: {}
