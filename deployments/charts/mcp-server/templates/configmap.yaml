apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-server.fullname" . }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
data:
  PORT: "8080"
  {{- if .Values.global.observability.enabled }}
  PROMETHEUS_URL: "http://rca-observability-prometheus"
  TEMPO_URL: "http://rca-observability-tempo:3200"
  LOG_BACKEND_URL: "http://rca-observability-loki:3100"
  {{- end }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
