global:
  database:
    deploymentManagerSecretName: rca-platform-database-deployment-manager
    migratorSecretName: rca-platform-database-migrator
    agentSecretName: rca-platform-database-agent
    mcpSecretName: rca-platform-database-mcp
  externalSecrets:
    enabled: true
    mappings:
      - name: rca-asgardeo
        targetSecretName: rca-asgardeo
        data:
          - { secretKey: ASGARDEO_CLIENT_SECRET, remoteKey: /rca/production/asgardeo, property: clientSecret }
          - { secretKey: AUTH_SESSION_ENCRYPTION_KEY, remoteKey: /rca/production/asgardeo, property: sessionEncryptionKey }
      - name: rca-internal-auth
        targetSecretName: rca-internal-auth
        data:
          - { secretKey: INTERNAL_SERVICE_JWT_SECRET, remoteKey: /rca/production/internal-auth, property: jwtSecret }
      - name: rca-platform-database-deployment-manager
        targetSecretName: rca-platform-database-deployment-manager
        data:
          - { secretKey: DATABASE_URL, remoteKey: /rca/production/database, property: deploymentManagerUrl }
      - name: rca-platform-database-migrator
        targetSecretName: rca-platform-database-migrator
        data:
          - { secretKey: DATABASE_URL, remoteKey: /rca/production/database, property: migratorUrl }
      - name: rca-platform-database-agent
        targetSecretName: rca-platform-database-agent
        data:
          - { secretKey: DATABASE_URL, remoteKey: /rca/production/database, property: agentUrl }
      - name: rca-platform-database-mcp
        targetSecretName: rca-platform-database-mcp
        data:
          - { secretKey: DATABASE_URL, remoteKey: /rca/production/database, property: mcpUrl }

postgres:
  enabled: false

registry:
  enabled: false

gateway:
  enabled: true
  consoleHostname: REPLACE_WITH_UI_HOSTNAME
  deploymentManagerHostname: REPLACE_WITH_MANAGER_HOSTNAME
  applicationWildcardHostname: "*.REPLACE_WITH_APPLICATION_DOMAIN"
  tls:
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: letsencrypt-production
    localIssuer:
      enabled: false
  aws:
    enabled: true

deployment-manager:
  tenantNetworkPolicy:
    enabled: true
  applicationRouting:
    enabled: true
    gatewayName: rca-gateway
    applicationWildcardHostname: "*.REPLACE_WITH_APPLICATION_DOMAIN"
    namespaceLabel:
      key: rca-platform.io/gateway-access
      value: "true"
  image:
    repository: REPLACE_WITH_ECR/deployment-manager
    tag: REPLACE_WITH_IMMUTABLE_TAG
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  config:
    AUTH_CALLBACK_URL: https://REPLACE_WITH_UI_HOSTNAME/auth/callback
    APP_UI_URL: https://REPLACE_WITH_UI_HOSTNAME
    AUTH_POST_LOGOUT_URL: https://REPLACE_WITH_UI_HOSTNAME
    AUTH_COOKIE_SECURE: "true"
    APP_UI_ORIGINS: https://REPLACE_WITH_UI_HOSTNAME

frontend:
  image:
    repository: REPLACE_WITH_ECR/frontend
    tag: REPLACE_WITH_IMMUTABLE_TAG
    pullPolicy: IfNotPresent
  config:
    environment: production

rca-agent:
  image:
    repository: REPLACE_WITH_ECR/rca-agent
    tag: REPLACE_WITH_IMMUTABLE_TAG
    pullPolicy: IfNotPresent

mcp-server:
  image:
    repository: REPLACE_WITH_ECR/mcp-server
    tag: REPLACE_WITH_IMMUTABLE_TAG
    pullPolicy: IfNotPresent

prometheus:
  server:
    retention: 7d
    persistentVolume: { enabled: true, size: 50Gi, storageClass: gp3 }

loki:
  singleBinary:
    persistence: { enabled: true, size: 50Gi, storageClass: gp3 }

tempo:
  tempo: { retention: 168h }
  persistence: { enabled: true, size: 50Gi, storageClassName: gp3 }
