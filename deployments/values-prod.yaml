postgres:
  enabled: false

registry:
  enabled: false

deployment-manager:
  image:
    repository: REPLACE_WITH_ECR/deployment-manager
    tag: REPLACE_WITH_IMMUTABLE_TAG
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP

rca-agent:
  image:
    repository: REPLACE_WITH_ECR/rca-agent
    tag: REPLACE_WITH_IMMUTABLE_TAG
    pullPolicy: IfNotPresent

mcp-server:
  image:
    repository: REPLACE_WITH_ECR/mcp-server
    tag: REPLACE_WITH_IMMUTABLE_TAG
    pullPolicy: IfNotPresent

prometheus:
  server:
    retention: 7d
    persistentVolume: { enabled: true, size: 50Gi, storageClass: gp3 }

loki:
  singleBinary:
    persistence: { enabled: true, size: 50Gi, storageClass: gp3 }

tempo:
  tempo: { retention: 168h }
  persistence: { enabled: true, size: 50Gi, storageClassName: gp3 }

grafana:
  persistence: { enabled: true, size: 10Gi, storageClassName: gp3 }
