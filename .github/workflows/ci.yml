name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  deployment-manager:
    name: Deployment Manager
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment-manager-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deployment-manager-service/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand

  database-integration:
    name: PostgreSQL migrations and RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: deployment_manager
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deployment_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deployment-manager-service/package-lock.json
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Initialize restricted database roles
        env:
          PGPASSWORD: postgres-ci
        run: >-
          psql --host localhost --username postgres --dbname deployment_manager
          --set=dm_password=deployment-manager-ci
          --set=migrator_password=migrator-ci
          --set=agent_password=agent-ci
          --set=mcp_password=mcp-ci
          --file deployments/charts/postgres/files/rca-roles.sql
      - name: Install Deployment Manager dependencies
        working-directory: deployment-manager-service
        run: npm ci
      - name: Apply Prisma migrations as migrator
        working-directory: deployment-manager-service
        env:
          DATABASE_URL: postgresql://rca_migrator:migrator-ci@localhost:5432/deployment_manager
        run: npm run prisma:migrate:deploy
      - name: Run RLS integration tests as Deployment Manager
        working-directory: deployment-manager-service
        env:
          DATABASE_URL: postgresql://deployment_manager:deployment-manager-ci@localhost:5432/deployment_manager
          RUN_DATABASE_INTEGRATION_TESTS: "true"
        run: npm test -- --runInBand database/rls.integration.spec.ts

  rca-agent:
    name: RCA Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rca-agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rca-agent-service/pyproject.toml
      - run: python -m pip install '.[test]'
      - run: python -m compileall -q src
      - name: Import application
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
          INTERNAL_SERVICE_JWT_SECRET: ci-only-internal-secret-at-least-32-bytes
          RCA_AGENT_POLL_ENABLED: "false"
        run: python -c "from src.main import app; assert app.title == 'RCA Agent Service'"
      - name: Run Python tests when present
        shell: bash
        run: |
          if find tests -type f -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m pytest
          else
            echo "No Python tests are checked in yet; compile and import checks passed."
          fi

  mcp-server:
    name: MCP Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rca-mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: rca-mcp-server/go.mod
          cache-dependency-path: rca-mcp-server/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/rca-mcp-server

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Add Helm dependency repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update
      - run: helm dependency build deployments
      - run: helm lint deployments -f deployments/values-kind.yaml
      - name: Render Kind manifests
        run: >-
          helm template rca-platform deployments
          --namespace rca-platform
          -f deployments/values-kind.yaml
          >/dev/null
      - name: Render production manifests
        run: >-
          helm template rca-platform deployments
          --namespace rca-platform
          -f deployments/values-prod.yaml
          --set-string gateway.deploymentManagerHostname=manager.rca.example.com
          --set-string 'gateway.applicationWildcardHostname=*.apps.rca.example.com'
          >/dev/null

  docker:
    name: Docker - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deployment-manager
            context: deployment-manager-service
            file: deployment-manager-service/Dockerfile
          - name: rca-agent
            context: rca-agent-service
            file: rca-agent-service/Dockerfile
          - name: mcp-server
            context: rca-mcp-server
            file: rca-mcp-server/Dockerfile
          - name: buildpack-runner
            context: deployment-manager-service/buildpack-runner
            file: deployment-manager-service/buildpack-runner/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=ci
            VCS_REF=${{ github.sha }}
            SOURCE_URL=https://github.com/venumigihansa/NexCause
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}
