{{- $password := required "postgres.auth.password is required when bundled Postgres is enabled" .Values.auth.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rca-platform.databaseSecretName" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s?schema=public&sslmode=disable" .Values.auth.username $password (include "postgres.fullname" .) .Values.service.port .Values.auth.database | quote }}
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_DB: {{ .Values.auth.database | quote }}
